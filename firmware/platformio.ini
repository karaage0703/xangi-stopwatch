[platformio]
default_envs = stopwatch-main
src_dir = examples

[env:stopwatch-main]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 921600
build_src_filter = -<*> +<stopwatch/main/*>
build_flags = -DESP32S3 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    m5stack/M5PM1@1.0.7
    m5stack/M5IOE1@1.0.9

[env:stopwatch-main-tailnet]
extends = env:stopwatch-main
build_flags =
    ${env:stopwatch-main.build_flags}
    -DXANGI_STOPWATCH_TAILNET=1
    -DCONFIG_ML_MAX_PEERS=8
    -DCONFIG_ML_H2_BUFFER_SIZE_KB=64
    -DCONFIG_ML_JSON_BUFFER_SIZE_KB=64
    -DCONFIG_ML_NVS_MAX_PEERS=16
    -DCONFIG_ML_DEVICE_NAME=\"xangi-stopwatch\"
    -DCONFIG_ML_PRIORITY_PEER_IP=\"\"
    -I.deps/microlink/components/microlink/components/wireguard_lwip/src/crypto/refc
lib_deps =
    ${env:stopwatch-main.lib_deps}
    file://.deps/microlink/components/microlink
    file://.deps/microlink/components/microlink/components/wireguard_lwip
