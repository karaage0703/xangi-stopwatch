[project]
name = "xangi-stopwatch"
version = "0.1.3"
description = "StopWatch standalone voice conversations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=11.0", "pyserial>=3.5"]

[project.optional-dependencies]
voice = ["faster-whisper==1.2.1", "av<19"]

[project.scripts]
xangi-stopwatch-wifi = "xangi_stopwatch.usb_wifi:main"
xangi-stopwatch-extension = "xangi_stopwatch.extension:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
